<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; width: 100%; max-width: 480px; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .info { color: #6b7280; font-size: .85rem; margin-bottom: 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li button { background: #ef4444; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">To-Do App</h1>
    <div class="info" id="info"></div>
    <form id="form">
      <input id="input" placeholder="New task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
  </div>

  <script>
    const list = document.getElementById('list');

    async function load() {
      const info = await (await fetch('/api/info')).json();
      document.getElementById('title').textContent = info.app;
      document.getElementById('info').textContent = `Served by ${info.hostname} on port ${info.port}`;
      render(await (await fetch('/api/todos')).json());
    }

    function render(todos) {
      list.innerHTML = '';
      todos.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        const span = document.createElement('span');
        span.textContent = t.title;
        span.onclick = async () => { await fetch('/api/todos/' + t.id, { method: 'PATCH' }); load(); };
        const del = document.createElement('button');
        del.textContent = 'x';
        del.onclick = async () => { await fetch('/api/todos/' + t.id, { method: 'DELETE' }); load(); };
        li.append(span, del);
        list.appendChild(li);
      });
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      load();
    };

    load();
  </script>
</body>
</html>
